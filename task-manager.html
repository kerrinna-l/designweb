<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white w-full max-w-md rounded-xl shadow-md p-6" x-data="{
      newTodo: '',
      filter: 'all',
      todos: [
        { id: 1, text: 'Aprender Alpine.js', done: true },
        { id: 2, text: 'Criar Store Global', done: false },
        { id: 3, text: 'Finalizar Projeto', done: false }
      ],
      get filtered() {
        if (this.filter === 'done') return this.todos.filter(t => t.done)
        if (this.filter === 'todo') return this.todos.filter(t => !t.done)
        return this.todos
      },
      add() {
        if (!this.newTodo.trim()) return
        this.todos.push({ id: Date.now(), text: this.newTodo, done: false })
        this.newTodo = ''
      }
    }">

        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold">Minhas Tarefas</h2>
            <span class="bg-blue-100 text-blue-600 text-xs px-3 py-1 rounded-full font-bold">
                <span x-text="todos.filter(t => !t.done).length"></span> pendentes
            </span>
        </div>

        <div class="flex items-center gap-2 mb-3">
            <input type="text" placeholder="Nova tarefa..."
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                x-model="newTodo" @keydown.enter="add()">
            <button class="w-10 h-10 bg-blue-600 text-white rounded-lg" @click="add()">+</button>
        </div>

        <div class="flex gap-2 mb-4">
            <button @click="filter = 'all'" class="font-bold px-4 py-1 rounded-full text-sm" :class="filter === 'all'
          ? 'bg-gray-900 text-white'
          : 'bg-gray-100 text-gray-600'">
                Todas
            </button>

            <button @click="filter = 'todo'" class="font-bold px-4 py-1 rounded-full text-sm" :class="filter === 'todo'
          ? 'bg-gray-900 text-white'
          : 'bg-gray-100 text-gray-600'">
                Pendentes
            </button>

            <button @click="filter = 'done'" class="font-bold px-4 py-1 rounded-full text-sm" :class="filter === 'done'
          ? 'bg-gray-900 text-white'
          : 'bg-gray-100 text-gray-600'">
                Feitas
            </button>
        </div>

        <div class="space-y-3">
            <template x-for="todo in filtered" :key="todo.id">
                <div class="flex items-center gap-3 border border-gray-100 rounded-md px-4 py-3 shadow-sm bg-white">

                    <!-- Utilizei IA pra fazer esse input -->
                    <input type="checkbox" x-model="todo.done" class="appearance-none w-5 h-5 border-2 border-gray-300 rounded-md checked:bg-emerald-500 checked:border-emerald-500 cursor-pointer relative
                      before:content-[''] before:absolute before:w-full before:h-full before:bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJ3aGl0ZSIgc3Ryb2tlLXdpZHRoPSIzIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiPjxwYXRoIGQ9Ik0yMCA2TDkgMTdsLTUtNSIvPjwvc3ZnPg==')] 
                      before:bg-center before:bg-no-repeat before:hidden checked:before:block transition-all">

                    <span x-text="todo.text" class="text-sm font-medium transition-all"
                        :class="todo.done ? 'line-through text-gray-300' : 'text-gray-500'">
                    </span>

                </div>
            </template>
        </div>

    </div>

</body>

</html>
