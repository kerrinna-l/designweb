<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portifólio - Tailwind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&display=swap" rel="stylesheet">
</head>

<body class="p-30 font-[Alan_Sans] bg-pink-50">

    <!--
        fundo branco
        padding 6 * referencia
        border-radius
        sombra
    -->
    <h1 class="text-4xl font-bold text-pink-400 mb-2">Título Alan Sans</h1>
    <!-- configuração de parágrafo -->
    <p class="text-pink-300 font-light mb-7">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Hic maxime repellat dignissimos repudiandae dolor,
        rerum deserunt facere sunt id ipsa sit distinctio expedita, odio esse doloremque non debitis nulla nostrum!</p>
    <section class="bg-pink-400 p-6 rounded shadow">
        <!-- alterando a cor do texto para cinza-->
        <p class="text-pink-50 text-2xl font-medium">
            Hello World!
        </p>
    </section>

    <!--
        flexbox      -> .flex
        grid         -> .grid
        jistfy-*     -> alinhamento horizontal
        items-*      -> alinhamento vertical
        gap-*        -> controle de espaçamento entre os itens
    -->

        <section class="grid grid-cols-1 md:grid-cols-3 gap-6 p-6 bg-pink-300">
            <div class="bg-pink-100 p-4 rounded text-pink-500">Design</div>
            <div class="bg-pink-100 p-4 rounded text-pink-500">Desenvolvimento</div>
            <div class="bg-pink-100 p-4 rounded text-pink-500">Consultoria</div>
        </section>
</body>

</html>
