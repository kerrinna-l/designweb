<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <title>Document</title>
</head>

<body>
    <div x-data="{ liked: false, count: 0 }">
        <button @click="liked = !liked, count = liked ? count + 1 : count - 1" x-text="liked ? '❤️' : '🤍'"></button>
            <span x-text="count"></span> curtidas
        </span>
    </div>
</body>

</html>
