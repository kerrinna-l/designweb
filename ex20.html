<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <title>Document</title>
</head>

<body>
   <center>
        <div x-data="{ zoom: false }">
         <img

            @mouseenter="zoom = true"
            @mouseleave="zoom = false">
        </div>
    </center>

</html>
